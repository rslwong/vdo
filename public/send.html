<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDO Share — Send</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #eee; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; color: #fff; }
    #video-wrap { position: relative; width: 100%; max-width: 720px; background: #1a1a1a; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #status-badge { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: #333; color: #aaa; }
    #status-badge.connected { background: #1a3a1a; color: #4ade80; }
    #status-badge.waiting { background: #3a2a00; color: #fbbf24; }
    #controls { margin-top: 1.5rem; width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 1rem; }
    .card { background: #1a1a1a; border-radius: 10px; padding: 1.2rem; }
    .card label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .room-row { display: flex; gap: 0.5rem; align-items: center; }
    #room-code { background: #111; border: 1px solid #333; color: #fff; font-size: 1.1rem; font-family: monospace; padding: 0.5rem 0.75rem; border-radius: 6px; flex: 1; letter-spacing: 0.1em; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; }
    #copy-btn { background: #2563eb; color: #fff; }
    #copy-btn:hover { background: #1d4ed8; }
    #share-link { word-break: break-all; font-size: 0.8rem; color: #60a5fa; margin-top: 0.5rem; }
    select { background: #111; border: 1px solid #333; color: #fff; padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.85rem; width: 100%; }
    #bottom-row { width: 100%; max-width: 720px; display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    #start-btn { flex: 1; padding: 0.75rem; background: #16a34a; color: #fff; font-size: 1rem; font-weight: 700; border-radius: 8px; }
    #start-btn:hover { background: #15803d; }
    #start-btn:disabled { background: #1a3a1a; color: #555; cursor: not-allowed; }
    #mute-btn { padding: 0.75rem 1.2rem; background: #222; color: #ccc; font-size: 1rem; font-weight: 700; border-radius: 8px; display: none; }
    #mute-btn:hover { background: #2a2a2a; }
    #mute-btn.muted { background: #7f1d1d; color: #fca5a5; }
    #flip-btn { padding: 0.75rem 1.2rem; background: #222; color: #ccc; font-size: 1rem; font-weight: 700; border-radius: 8px; display: none; }
    #flip-btn:hover { background: #2a2a2a; }
    #flip-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #log { font-size: 0.75rem; color: #555; margin-top: 0.5rem; }
    input[type=range] { width: 100%; accent-color: #2563eb; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📷 Camera Sender</h1>

  <div id="video-wrap">
    <video id="local-video" autoplay muted playsinline></video>
    <div id="status-badge">Idle</div>
  </div>

  <div id="controls">
    <div class="card">
      <label>Camera</label>
      <select id="camera-select"></select>
    </div>

    <div class="card">
      <label>Room Code — share this with the receiver</label>
      <div class="room-row">
        <input id="room-code" maxlength="3" placeholder="123" oninput="updateShareLink()" />
        <button id="copy-btn" onclick="copyLink()">Copy Link</button>
      </div>
      <div id="share-link"></div>
    </div>

    <div class="card" id="zoom-card" style="display:none">
      <label>Zoom: <span id="zoom-label">1.0×</span></label>
      <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1" oninput="setZoom(this.value)">
    </div>

    <div id="bottom-row">
      <button id="start-btn" onclick="start()">Start Camera &amp; Wait for Receiver</button>
      <button id="mute-btn" onclick="toggleMute()">🎙 Mute</button>
      <button id="flip-btn" onclick="flipCamera()">🔄 Flip</button>
    </div>
  </div>

  <div id="log"></div>

  <script>
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ];

    let roomId = localStorage.getItem('vdo-room-id') || String(Math.floor(Math.random() * 900) + 100);
    document.getElementById('room-code').value = roomId;
    updateShareLink();

    function updateShareLink() {
      const code = document.getElementById('room-code').value.trim();
      document.getElementById('share-link').textContent = code
        ? `${location.origin}/receive.html?room=${code}`
        : '';
    }

    let ws, pc, localStream, canvasStream, rawVideoEl;
    let remoteDescSet = false;
    let pendingCandidates = [];
    let zoomLevel = 1;
    let canvasActive = false;
    let videoDevices = [];
    let currentDeviceIndex = 0;

    const zoomCanvas = document.createElement('canvas');
    const zoomCtx = zoomCanvas.getContext('2d');

    async function setZoom(value) {
      zoomLevel = parseFloat(value);
      document.getElementById('zoom-label').textContent = zoomLevel.toFixed(1) + '×';
      if (zoomLevel === 1 && canvasActive) {
        await disableCanvasPipeline();
      } else if (zoomLevel !== 1 && !canvasActive) {
        await enableCanvasPipeline();
      }
    }

    async function enableCanvasPipeline() {
      canvasActive = true;
      (function drawFrame() {
        if (!canvasActive) return;
        if (rawVideoEl.readyState >= 2) {
          const vw = rawVideoEl.videoWidth;
          const vh = rawVideoEl.videoHeight;
          if (zoomCanvas.width !== vw || zoomCanvas.height !== vh) {
            zoomCanvas.width = vw;
            zoomCanvas.height = vh;
          }
          const sw = vw / zoomLevel;
          const sh = vh / zoomLevel;
          const sx = (vw - sw) / 2;
          const sy = (vh - sh) / 2;
          zoomCtx.drawImage(rawVideoEl, sx, sy, sw, sh, 0, 0, vw, vh);
        }
        requestAnimationFrame(drawFrame);
      })();
      canvasStream = zoomCanvas.captureStream(30);
      localStream.getAudioTracks().forEach(t => canvasStream.addTrack(t));
      document.getElementById('local-video').srcObject = canvasStream;
      if (pc) {
        const sender = pc.getSenders().find(s => s.track?.kind === 'video');
        if (sender) await sender.replaceTrack(canvasStream.getVideoTracks()[0]);
      }
    }

    async function disableCanvasPipeline() {
      canvasActive = false;
      canvasStream = null;
      document.getElementById('local-video').srcObject = localStream;
      if (pc) {
        const sender = pc.getSenders().find(s => s.track?.kind === 'video');
        if (sender) await sender.replaceTrack(localStream.getVideoTracks()[0]);
      }
    }
    const statusBadge = document.getElementById('status-badge');
    const logEl = document.getElementById('log');

    function log(msg) {
      console.log(msg);
      logEl.textContent = msg;
    }

    function setStatus(text, cls) {
      statusBadge.textContent = text;
      statusBadge.className = cls ? `connected ${cls}` : '';
    }

    async function populateCameras() {
      // Request permission first so labels are available
      try {
        const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
        tmp.getTracks().forEach(t => t.stop());
      } catch {}
      const devices = await navigator.mediaDevices.enumerateDevices();
      const sel = document.getElementById('camera-select');
      sel.innerHTML = '';
      videoDevices = devices.filter(d => d.kind === 'videoinput');
      videoDevices.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${i + 1}`;
        sel.appendChild(opt);
      });
    }

    async function start() {
      roomId = document.getElementById('room-code').value.trim();
      if (!roomId) { log('Enter a room code first'); return; }
      localStorage.setItem('vdo-room-id', roomId);
      document.getElementById('start-btn').disabled = true;
      const deviceId = document.getElementById('camera-select').value;
      currentDeviceIndex = videoDevices.findIndex(d => d.deviceId === deviceId);
      if (currentDeviceIndex === -1) currentDeviceIndex = 0;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: deviceId ? { deviceId: { exact: deviceId } } : true,
          audio: true
        });
        // Hidden video element feeds the canvas when zoom > 1
        rawVideoEl = document.createElement('video');
        rawVideoEl.srcObject = localStream;
        rawVideoEl.muted = true;
        rawVideoEl.playsInline = true;
        rawVideoEl.play();
        // Start with raw stream — no canvas overhead at 1×
        document.getElementById('local-video').srcObject = localStream;
        document.getElementById('mute-btn').style.display = 'block';
        document.getElementById('zoom-card').style.display = 'block';
        if (videoDevices.length > 1) document.getElementById('flip-btn').style.display = 'block';
      } catch (e) {
        log('Camera error: ' + e.message);
        document.getElementById('start-btn').disabled = false;
        return;
      }

      connect();
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', room: roomId, role: 'sender' }));
        setStatus('Waiting for receiver…', 'waiting');
        log('Waiting for receiver to join with room code: ' + roomId);
      };

      ws.onmessage = async ({ data }) => {
        const msg = JSON.parse(data);

        if (msg.type === 'ready') {
          log('Receiver connected — starting negotiation');
          await createOffer();
        } else if (msg.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          remoteDescSet = true;
          for (const c of pendingCandidates) {
            try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
          }
          pendingCandidates = [];
          log('Answer received — establishing connection…');
        } else if (msg.type === 'ice-candidate') {
          if (remoteDescSet) {
            try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch {}
          } else {
            pendingCandidates.push(msg.candidate);
          }
        } else if (msg.type === 'peer-disconnected') {
          setStatus('Receiver disconnected', '');
          log('Receiver disconnected');
        }
      };

      ws.onclose = () => log('Signaling server disconnected');
    }

    async function createOffer() {
      remoteDescSet = false;
      pendingCandidates = [];
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      const streamForRTC = canvasStream || localStream;
      streamForRTC.getTracks().forEach(track => pc.addTrack(track, streamForRTC));

      pc.onicecandidate = ({ candidate }) => {
        if (candidate) {
          ws.send(JSON.stringify({ type: 'ice-candidate', candidate }));
        }
      };

      pc.onconnectionstatechange = () => {
        log('Connection state: ' + pc.connectionState);
        if (pc.connectionState === 'connected') {
          setStatus('● Live', 'connected');
        } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
          setStatus('Disconnected', '');
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
      log('Offer sent — waiting for answer…');
    }

    async function flipCamera() {
      if (!rawVideoEl || videoDevices.length < 2) return;
      const btn = document.getElementById('flip-btn');
      btn.disabled = true;
      currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
      const deviceId = videoDevices[currentDeviceIndex].deviceId;
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } });
        localStream.getVideoTracks().forEach(t => t.stop());
        localStream = new MediaStream([...newStream.getVideoTracks(), ...localStream.getAudioTracks()]);
        rawVideoEl.srcObject = localStream;
        await rawVideoEl.play();
        if (!canvasActive) {
          // Raw mode: update preview and PC track directly
          document.getElementById('local-video').srcObject = localStream;
          if (pc) {
            const sender = pc.getSenders().find(s => s.track?.kind === 'video');
            if (sender) await sender.replaceTrack(localStream.getVideoTracks()[0]);
          }
        }
        // Canvas mode: rawVideoEl already updated; canvas draws the new camera automatically
      } catch (e) {
        log('Camera flip failed: ' + e.message);
      }
      btn.disabled = false;
    }

    function toggleMute() {
      const btn = document.getElementById('mute-btn');
      const audioTracks = localStream ? localStream.getAudioTracks() : [];
      if (audioTracks.length === 0) return;
      const muted = audioTracks[0].enabled;  // currently enabled → about to mute
      audioTracks.forEach(t => { t.enabled = !muted; });
      btn.textContent = muted ? '🔇 Unmute' : '🎙 Mute';
      btn.classList.toggle('muted', muted);
    }

    function copyLink() {
      const url = `${location.origin}/receive.html?room=${roomId}`;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy Link', 2000);
      });
    }

    populateCameras();
  </script>
</body>
</html>
